name: Make intro clip (Pro, Remotion)

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: intro/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pillow
      - run: npm ci --no-audit --no-fund
      - name: Prepare assets
        run: |
          cp ../logo.png public/logo.png && mkdir -p public/el && cp ../elements/*.png public/el/
          python3 make_audio.py && python3 make_audio_elements.py
      - name: Render
        run: |
          npx remotion render ElementsIntro out/elements-intro.mp4 --crf=18
          npx remotion render ClawReveal out/claw-reveal.mp4 --crf=18
      - uses: actions/upload-artifact@v4
        with:
          name: pro-intro-clips
          path: intro/remotion/out/*.mp4
          retention-days: 30
